# DocNative — compose standalone (desarrollo / prueba local en Windows containers).
# Uso desde raíz SID:
#   docker compose -f DocNative-SID/docker/docker-compose.docnative.yml --env-file docker.env.windows up -d --build

name: docnative-local

services:
  docnative:
    image: ${DOCKER_REGISTRY:-sid}/docnative:${SID_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.windows
    pull_policy: never
    restart: unless-stopped
    isolation: process
    volumes:
      - "${PYVISION_HOST_PAGAREOCR_ENTRADA:-D:/SID/COOPROGRESO/PAGAREOCR/ENTRADA}:C:/mnt/PagareOcrEntrada:rw"
      - "${PYVISION_HOST_PAGAREOCR_PROCESANDO:-D:/SID/COOPROGRESO/PAGAREOCR/PROCESANDO_DOCNATIVE}:C:/mnt/PagareOcrProcesando:rw"
      - "${PYVISION_HOST_PAGAREOCR_PREPROCESADO:-D:/SID/COOPROGRESO/PAGAREOCR/PRE_PROCESADO}:C:/mnt/PagareOcrPreProcesado:rw"
      - "${PYVISION_HOST_PAGAREOCR_SALIDA:-D:/SID/COOPROGRESO/PAGAREOCR/SALIDA}:C:/mnt/PagareOcrSalida:rw"
    environment:
      DocNative__OutputRoot: "C:/mnt/PagareOcrEntrada"
      DocNative__ProcesandoRoot: "C:/mnt/PagareOcrProcesando"
      DocNative__PreProcesadoRoot: "C:/mnt/PagareOcrPreProcesado"
      DocNative__SalidaRoot: "C:/mnt/PagareOcrSalida"
      DocNative__ErrorRoot: ""
      DocNative__CsvReportTime: "${DOCNATIVE_CSV_REPORT_TIME:-23:50}"
      DocNative__BlankPageThreshold: "${DOCNATIVE_BLANK_PAGE_THRESHOLD:-0.02}"
